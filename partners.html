<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdGen Quest · Партнёры</title><style>body{background:#08142b;color:#ecf2fc;font:15px system-ui;margin:0}main{max-width:950px;margin:auto;padding:20px}.card{background:#142442;border:1px solid #304367;border-radius:15px;padding:18px;margin:15px 0}input,select,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:10px;font:inherit}input,select{background:#091830;color:white;border:1px solid #456}button{background:#3978f3;border:0;color:white;font-weight:bold}a{color:#9cc9ff}.dim{color:#a5b8d2}.item{border-bottom:1px solid #344966;padding:11px}.item b{display:block}.stats{font-size:17px;font-weight:600}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><a href="index.html">← Вернуться в Quest</a><h1>🤝 Партнёры Bidster CRM</h1><p class="dim">Данные общей Bidster CRM, не обязательно AdGen Tech. Кандидаты на реактивацию — были закупки в 2026, но не в сентябре.</p><div class="card"><h2>Импорт CSV</h2><select id="period"><option value="2026-ytd">2026 накопительно до 12 октября</option><option value="2026-09">Сентябрь 2026</option></select><input id="file" type="file" accept=".csv"><button id="upload">Загрузить данные</button><p id="status" class="dim">Проверка подключения…</p></div><div class="card"><h2>Закупщики и история</h2><p class="stats" id="summary"></p><input id="search" placeholder="Поиск компании"><select id="filter"><option value="all">Все</option><option value="year">С Demand за год</option><option value="sep">С Demand в сентябре</option><option value="revive">Кандидаты на реактивацию</option></select><div id="list"></div></div></main><script>
const $=id=>document.getElementById(id);
const client=supabase.createClient(localStorage.getItem('quest_url')||'https://zmppaiiplinjkwiazmze.supabase.co',localStorage.getItem('quest_key')||'sb_publishable_n62kf4kgc6tV2Lfjmmk5Rg_lUbp1cjt');
let records=[];
function csv(s){let out=[],row=[],p='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(quoted){if(c==='"'&&s[i+1]==='"'){p+='"';i++}else if(c==='"')quoted=false;else p+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(p);p='';}else if(c==='\n'){row.push(p.replace(/\r$/,''));out.push(row);row=[];p='';}else p+=c;}if(row.length||p){row.push(p);out.push(row);}return out;}
function money(x){return '$'+Number(x||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function n(x){return Number(String(x||0).replaceAll(' ','').replace(',','.'))||0;}
async function load(){const r=await client.from('partner_stats').select('*').limit(5000);if(r.error){$('status').textContent=r.error.message;return;}records=r.data||[];render();}
function render(){let m=new Map();for(let r of records){let key=r.advertiser.toLowerCase();if(!m.has(key))m.set(key,{name:r.advertiser,year:0,sep:0});let v=m.get(key);if(r.period_key==='2026-ytd')v.year+=Number(r.demand_usd)||0;if(r.period_key==='2026-09')v.sep+=Number(r.demand_usd)||0;}let a=[...m.values()];let both=records.some(x=>x.period_key==='2026-ytd')&&records.some(x=>x.period_key==='2026-09');$('summary').textContent=a.length+' рекламодателей, '+(both?a.filter(x=>x.year>0&&x.sep===0).length+' кандидатов на реактивацию':'загрузи оба периода');let q=$('search').value.toLowerCase(),f=$('filter').value;$('list').replaceChildren();for(let x of a.filter(x=>x.name.toLowerCase().includes(q)).filter(x=>f==='all'||(f==='year'?x.year>0:f==='sep'?x.sep>0:both&&x.year>0&&x.sep===0)).sort((a,b)=>b.year-a.year)){let d=document.createElement('div');d.className='item';let b=document.createElement('b');b.textContent=x.name;let p=document.createElement('p');p.className='dim';p.textContent='2026: '+money(x.year)+' · сентябрь: '+money(x.sep);d.append(b,p);$('list').append(d);}}
$('search').oninput=render;$('filter').onchange=render;
$('upload').onclick=async()=>{const f=$('file').files[0],out=$('status');if(!f){out.textContent='Выбери CSV';return;}try{let rows=csv(await f.text()),h=rows.shift().map(x=>x.toLowerCase().trim()),i=k=>h.indexOf(k);if(i('advertiser')<0||i('type')<0||i('demand, $')<0)throw Error('Неверные заголовки CSV');let data=rows.filter(r=>r[i('advertiser')]&&r[i('advertiser')].toUpperCase()!=='TOTAL').map(r=>({period_key:$('period').value,advertiser:r[i('advertiser')],inventory_type:r[i('type')],demand_usd:n(r[i('demand, $')]),impressions:n(r[i('impressions')]),requests:n(r[i('requests')]),responses:n(r[i('responses')])}));for(let x=0;x<data.length;x+=40){const z=await client.from('partner_stats').upsert(data.slice(x,x+40),{onConflict:'period_key,advertiser,inventory_type'});if(z.error)throw Error(z.error.message);out.textContent='Загружено '+Math.min(x+40,data.length)+'/'+data.length;}out.textContent='Импорт завершён: '+data.length+' строк';await load();}catch(e){out.textContent='Ошибка: '+e.message;}};
(async()=>{let a=await client.auth.getSession();if(!a.data.session){$('status').textContent='Сначала авторизуйся в Quest';return;}$('status').textContent='Готово к загрузке';await load();})();
</script></body></html>
